<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Interativo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Formulário para Contato</h1>
    <p>Preencha os dois campos abaixo para contato.</p>

    <form id="formContato" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Ex: Ataru Moroboshi"
          autocomplete="name"
          aria-required="true"
          aria-describedby="erro-nome"
        >
        <span id="erro-nome" class="mensagem-erro" role="alert"></span>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Ex: ataru@email.com"
          autocomplete="email"
          aria-required="true"
          aria-describedby="erro-email"
        >
        <span id="erro-email" class="mensagem-erro" role="alert"></span>
      </div>

      <button type="submit" id="btnEnviar">
        Enviar
      </button>

      <div id="mensagem-sucesso" class="mensagem-sucesso" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
